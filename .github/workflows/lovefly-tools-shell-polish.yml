name: LoveFly tools shell polish
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove legacy visual conflicts
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/lovefly-tools.css')
          s=p.read_text()
          marker='/* Legacy conflict cleanup */'
          if marker not in s:
              s += '''\n\n/* Legacy conflict cleanup */\n*,*::before,*::after{box-sizing:border-box}\n.page-shell{border-top:0!important}\n.shell,.app-shell{padding-left:24px!important;padding-right:24px!important}\n.page-shell>.hero{padding-left:24px!important;padding-right:24px!important}\n.app-shell>.topbar h1::after{display:none!important}\n.overview-title h2,.section-heading h2{border-left:0!important;padding-left:0!important}\n.section-title{padding-bottom:10px!important;border-bottom:1px solid var(--lf-line-strong)!important}\n.section-title h2{color:var(--lf-ink)!important;font-weight:700!important}\n.section-title h2::before{content:\"\";display:inline-block;width:4px;height:16px;margin-right:8px;vertical-align:-2px;background:var(--lf-red)!important}\n@media(max-width:720px){.shell,.app-shell{padding-left:16px!important;padding-right:16px!important}.page-shell>.hero{padding-left:16px!important;padding-right:16px!important}}\n'''
              p.write_text(s)
          PY
          rm .github/workflows/lovefly-tools-shell-polish.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/lovefly-tools.css .github/workflows/lovefly-tools-shell-polish.yml
          git commit -m "Remove legacy conflicts from shared tool shell"
          git push