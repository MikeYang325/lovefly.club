name: Check LoveFly tools live
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check production pages and styles
        shell: bash
        run: |
          set +e
          failed=0
          for base in \
            https://666.lovefly.club \
            https://calendar.lovefly.club \
            https://ca-miles.lovefly.club \
            https://ram.lovefly.club
          do
            echo "===== $base ====="
            page="$(curl -LfsS --max-time 30 "$base/" 2>&1)"
            page_rc=$?
            if [ $page_rc -ne 0 ]; then
              echo "PAGE_FAIL rc=$page_rc $page"
              failed=1
            else
              if printf '%s' "$page" | grep -q 'lovefly-tools.css'; then
                echo "PAGE_STYLE_REF=YES"
                printf '%s' "$page" | grep -oE 'lovefly-tools\.css[^"'"' >]*' | head -1
              else
                echo "PAGE_STYLE_REF=NO"
                failed=1
              fi
            fi

            css="$(curl -LfsS --max-time 30 "$base/lovefly-tools.css?v=20260830-shell-2" 2>&1)"
            css_rc=$?
            if [ $css_rc -ne 0 ]; then
              echo "CSS_FAIL rc=$css_rc $css"
              failed=1
            elif printf '%s' "$css" | grep -q -- '--lf-content:1440px'; then
              echo "CSS_MARKER=YES"
            else
              echo "CSS_MARKER=NO"
              printf '%s' "$css" | head -c 200
              echo
              failed=1
            fi
          done
          exit $failed
