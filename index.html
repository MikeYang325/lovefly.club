<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f4ee">
  <meta name="description" content="LOVEFLY.CLUB — For those who simply love to fly.">
  <title>LOVEFLY.CLUB — For those who simply love to fly.</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="home">
    <header class="topbar">
      <a class="brand" href="/" aria-label="LOVEFLY.CLUB home">LOVEFLY<span>.CLUB</span></a>
      <div class="edition">EST. 2026</div>
    </header>

    <section class="hero" aria-labelledby="hero-title">
      <div class="flight-path" aria-hidden="true"><i></i></div>

      <div class="hero-mark" id="hero-title">
        <span class="love">Love</span>
        <span class="fly">FLY<span class="dot">.</span></span>
      </div>

      <div class="hero-copy">
        <p class="tagline">For those who simply love to fly.</p>
        <p class="topics">Flights <span>·</span> Miles <span>·</span> Aircraft <span>·</span> Tools</p>
      </div>
    </section>

    <footer class="bottom">
      <p class="signature">Made somewhere between the ground and FL400.</p>
      <nav class="areas" aria-label="LoveFly areas">
        <span>TOOLS</span>
        <span>FLIGHTS</span>
        <span>LOGBOOK</span>
        <span>MILES</span>
        <span>TRIPS</span>
        <span>PROJECTS</span>
      </nav>
    </footer>
  </main>
</body>
</html>
